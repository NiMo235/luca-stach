<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>/*[|template_title|]*/0</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root {
                --ink: #0a0d0a;
                --ink2: #0f130e;
                --paper: #eef1e9;
                --dim: #a8b0a2;
                --faint: #767e73;
                --acid: #b4ff39;
                --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
            }

            * { box-sizing: border-box; }

            .staticrypt-html { height: 100%; }

            .staticrypt-body {
                height: 100%;
                margin: 0;
                background-color: var(--ink);
                color: var(--paper);
                font-family: var(--mono);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                overflow: hidden;
            }

            /* faint grid, matches the site */
            .staticrypt-body::before {
                content: "";
                position: fixed;
                inset: 0;
                background-image:
                    linear-gradient(rgba(238, 241, 233, 0.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(238, 241, 233, 0.05) 1px, transparent 1px);
                background-size: 48px 48px;
                pointer-events: none;
            }

            /* scanlines */
            .staticrypt-body::after {
                content: "";
                position: fixed;
                inset: 0;
                background: repeating-linear-gradient(
                    to bottom,
                    transparent 0 2px,
                    rgba(0, 0, 0, 0.14) 2px 4px
                );
                pointer-events: none;
                mix-blend-mode: multiply;
            }

            /* vignette */
            .gate-vignette {
                position: fixed;
                inset: 0;
                background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.55) 100%);
                pointer-events: none;
            }

            .gate-stage {
                position: relative;
                z-index: 1;
                min-height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1.5rem;
            }

            .gate-window {
                width: min(560px, 100%);
                border: 1px solid rgba(180, 255, 57, 0.22);
                background: rgba(15, 19, 14, 0.92);
                box-shadow: 0 0 60px rgba(180, 255, 57, 0.06), 0 30px 80px rgba(0, 0, 0, 0.5);
            }

            .gate-titlebar {
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 10px 14px;
                border-bottom: 1px solid rgba(238, 241, 233, 0.08);
            }

            .gate-dot {
                width: 9px;
                height: 9px;
                border-radius: 50%;
                background: rgba(238, 241, 233, 0.18);
            }
            .gate-dot:first-child { background: rgba(180, 255, 57, 0.55); }

            .gate-title {
                margin-left: 8px;
                font-size: 10px;
                letter-spacing: 0.22em;
                text-transform: uppercase;
                color: var(--faint);
            }

            .gate-body {
                padding: 26px 26px 30px;
                font-size: 14px;
                line-height: 1.75;
                min-height: 190px;
            }

            #gate-lines p {
                margin: 0;
                color: var(--dim);
                white-space: pre-wrap;
                word-break: break-word;
            }
            #gate-lines p.gate-accent {
                color: var(--acid);
                text-shadow: 0 0 14px rgba(180, 255, 57, 0.45);
            }

            .gate-caret::after {
                content: "▌";
                color: var(--acid);
                animation: gate-blink 0.9s steps(1) infinite;
            }
            @keyframes gate-blink {
                0%, 49% { opacity: 1; }
                50%, 100% { opacity: 0; }
            }

            .staticrypt-form { margin-top: 20px; }

            .gate-input-row {
                display: flex;
                align-items: center;
                gap: 10px;
                border: 1px solid rgba(238, 241, 233, 0.16);
                background: rgba(10, 13, 10, 0.85);
                padding: 0 12px;
                transition: border-color 0.2s, box-shadow 0.2s;
            }
            .gate-input-row:focus-within {
                border-color: var(--acid);
                box-shadow: 0 0 0 1px rgba(180, 255, 57, 0.35), 0 0 24px rgba(180, 255, 57, 0.12);
            }
            .gate-prompt {
                color: var(--acid);
                user-select: none;
            }

            .staticrypt-password-container {
                position: relative;
                flex: 1;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                width: 100%;
                background: transparent;
                border: 0;
                outline: 0;
                padding: 14px 34px 14px 0;
                font-family: var(--mono);
                font-size: 15px;
                color: var(--paper);
                caret-color: var(--acid);
                letter-spacing: 0.06em;
            }
            .staticrypt-form input::placeholder { color: var(--faint); }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                opacity: 0.55;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                filter: invert(0.9);
            }
            .staticrypt-toggle-password-visibility:hover { opacity: 0.9; }

            .staticrypt-form .staticrypt-decrypt-button {
                margin-top: 16px;
                width: 100%;
                border: 1px solid var(--acid);
                background: rgba(180, 255, 57, 0.08);
                color: var(--acid);
                font-family: var(--mono);
                font-size: 13px;
                letter-spacing: 0.28em;
                text-transform: uppercase;
                padding: 14px;
                cursor: pointer;
                transition: background 0.15s, color 0.15s, box-shadow 0.15s;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: var(--acid);
                color: var(--ink);
                box-shadow: 0 0 28px rgba(180, 255, 57, 0.35);
                outline: none;
            }

            .gate-error {
                margin-top: 14px;
                min-height: 1.4em;
                font-size: 12px;
                letter-spacing: 0.12em;
                color: #ff6b5c;
                text-shadow: 0 0 12px rgba(255, 107, 92, 0.4);
            }
            .gate-error.is-visible { animation: gate-shake 0.4s; }
            @keyframes gate-shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-6px); }
                50% { transform: translateX(5px); }
                75% { transform: translateX(-3px); }
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-top: 14px;
                font-size: 12px;
                color: var(--faint);
                cursor: pointer;
            }
            .staticrypt-remember input[type="checkbox"] { accent-color: var(--acid); }

            .gate-foot {
                margin-top: 26px;
                font-size: 10px;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--faint);
            }
            .gate-foot .gate-status {
                color: var(--acid);
            }
            .gate-foot .gate-status::before {
                content: "●";
                margin-right: 6px;
                animation: gate-blink 1.6s steps(1) infinite;
            }

            .hidden { display: none !important; }

            .staticrypt-spinner-container {
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .staticrypt-spinner {
                width: 2rem;
                height: 2rem;
                border: 0.22em solid rgba(238, 241, 233, 0.2);
                border-right-color: var(--acid);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                .staticrypt-form input[type="text"] { font-size: 16px; }
            }

            @media (prefers-reduced-motion: reduce) {
                .gate-caret::after, .gate-foot .gate-status::before { animation: none; }
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div class="gate-vignette" aria-hidden="true"></div>

        <div id="staticrypt_loading" class="staticrypt-spinner-container">
            <div class="staticrypt-spinner"></div>
        </div>

        <div id="staticrypt_content" class="staticrypt-content hidden">
            <div class="gate-stage">
                <div class="gate-window">
                    <div class="gate-titlebar">
                        <span class="gate-dot"></span>
                        <span class="gate-dot"></span>
                        <span class="gate-dot"></span>
                        <span class="gate-title">STACH://FLIGHTDECK — ACCESS TERMINAL</span>
                    </div>
                    <div class="gate-body">
                        <div id="gate-lines" aria-live="polite"></div>

                        <form id="staticrypt-form" action="#" method="post" class="staticrypt-form">
                            <div class="gate-input-row">
                                <span class="gate-prompt" aria-hidden="true">&gt;</span>
                                <div class="staticrypt-password-container">
                                    <input
                                        id="staticrypt-password"
                                        type="password"
                                        name="password"
                                        placeholder="/*[|template_placeholder|]*/0"

                                        autofocus

                                    <img

                                    />
                                </div>
                            </div>

                            <p id="gate-error" class="gate-error" role="alert"></p>

                            <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
                                <input id="staticrypt-remember" type="checkbox" name="remember" />
                                /*[|template_remember|]*/0
                            </label>

                            <input type="submit" class="staticrypt-decrypt-button" value="/*[|template_button|]*/0" />
                        </form>

                        <p class="gate-foot">
                            <span class="gate-status">SECURE CHANNEL</span> · LUCA STACH — PORTFOLIO · 2026
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // these variables will be filled when generating the file - the template format is '/*[|variable_name|]*/0'
            const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
            const templateError = "/*[|template_error|]*/0",
                templateToggleAltShow = "/*[|template_toggle_show|]*/0",
                templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
                isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
                staticryptConfig = /*[|staticrypt_config|]*/ 0;

            const templateConfig = {
                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            /* typewriter intro — the gate already speaks the site's language */
            const gateReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            const gateLines = [
                "STACH://FLIGHTDECK v2.4",
                "establishing secure channel ...",
                "restricted area — identity required",
                "> enter access key",
            ];

            function typeGateLines() {
                const box = document.getElementById("gate-lines");
                const form = document.getElementById("staticrypt-form");
                const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

                /* the form is interactive immediately — typing is decoration, not a gate */
                form.classList.remove("hidden");
                document.getElementById("staticrypt-password").focus();

                if (gateReducedMotion) {
                    for (const line of gateLines) {
                        const p = document.createElement("p");
                        p.textContent = line;
                        box.appendChild(p);
                    }
                    return;
                }

                const typeLine = async (text, isLast) => {
                    const p = document.createElement("p");
                    if (isLast) p.className = "gate-accent";
                    const span = document.createElement("span");
                    const caret = document.createElement("span");
                    caret.className = "gate-caret";
                    p.append(span, caret);
                    box.appendChild(p);
                    for (let i = 0; i < text.length; i++) {
                        span.textContent = text.slice(0, i + 1);
                        let d = 22 + Math.random() * 42;
                        if (text[i] === " ") d += 38;
                        await sleep(d);
                    }
                    caret.remove();
                };

                (async () => {
                    await sleep(350);
                    for (let i = 0; i < gateLines.length; i++) {
                        await typeLine(gateLines[i], i === gateLines.length - 1);
                        await sleep(i === gateLines.length - 1 ? 120 : 180);
                    }
                })();
            }

            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

                if (!isSuccessful) {
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();

                    if (isRememberEnabled) {
                        document.getElementById("staticrypt-remember-label").classList.remove("hidden");
                    }

                    typeGateLines();
                }
            };

            // toggle password visibility
            const toggleIcon = document.querySelector(".staticrypt-toggle-password-visibility");
            const imgSrcEyeClosed =
                "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NDAgNTEyIj48IS0tIUZvbnQgQXdlc29tZSBGcmVlIDYuNS4yIGJ5IEBmb250YXdlc29tZSAtIGh0dHBzOi8vZm9udGF3ZXNvbWUuY29tIExpY2Vuc2UgLSBodHRwczovL2ZvbnRhd2Vzb21lLmNvbS9saWNlbnNlL2ZyZWUgQ29weXJpZ2h0IDIwMjQgRm9udGljb25zLCBJbmMuLS0+PHBhdGggZD0iTTM4LjggNS4xQzI4LjQtMy4xIDEzLjMtMS4yIDUuMSA5LjJTLTEuMiAzNC43IDkuMiA0Mi45bDU5MiA0NjRjMTAuNCA4LjIgMjUuNSA2LjMgMzMuNy00LjFzNi4zLTI1LjUtNC4xLTMzLjdMNTI1LjYgMzg2LjdjMzkuNi00MC42IDY2LjQtODYuMSA3OS45LTExOC40YzMuMy03LjkgMy4zLTE2LjcgMC0yNC42Yy0xNC45LTM1LjctNDYuMi04Ny43LTkzLTEzMS4xQzQ2NS41IDY4LjggNDAwLjggMzIgMzIwIDMyYy02OC4yIDAtMTI1IDI2LjMtMTY5LjMgNjAuOEwzOC44IDUuMXpNMjIzLjEgMTQ5LjVDMjQ4LjYgMTI2LjIgMjgyLjcgMTEyIDMyMCAxMTJjNzkuNSAwIDE0NCA2NC41IDE0NCAxNDRjMCAyNC45LTYuMyA0OC4zLTE3LjQgNjguN0w0MDggMjk0LjVjOC40LTE5LjMgMTAuNi00MS40IDQuOC02My4zYy0xMS4xLTQxLjUtNDcuOC02OS40LTg4LjYtNzEuMWMtNS44LS4yLTkuMiA2LjEtNy40IDExLjdjMi4xIDYuNCAzLjMgMTMuMiAzLjMgMjAuM2MwIDEwLjItMi40IDE5LjgtNi42IDI4LjNsLTkwLjMtNzAuOHpNMzczIDM4OS45Yy0xNi40IDYuNS0zNC4zIDEwLjEtNTMgMTAuMWMtNzkuNSAwLTE0NC02NC41LTE0NC0xNDRjMC02LjkgLjUtMTMuNiAxLjQtMjAuMkw4My4xIDE2MS41QzYwLjMgMTkxLjIgNDQgMjIwLjggMzQuNSAyNDMuN2MtMy4zIDcuOS0zLjMgMTYuNyAwIDI0LjZjMTQuOSAzNS43IDQ2LjIgODcuNyA5MyAxMzEuMUMxNzQuNSA0NDMuMiAyMzkuMiA0ODAgMzIwIDQ4MGM0Ny44IDAgODkuOS0xMi45IDEyNi4yLTMyLjVMMzczIDM4OS45eiIvPjwvc3ZnPg==";
            const imgSrcEyeOpened =
                "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1NzYgNTEyIj48IS0tIUZvbnQgQXdlc29tZSBGcmVlIDYuNS4yIGJ5IEBmb250YXdlc29tZSAtIGh0dHBzOi8vZm9udGF3ZXNvbWUuY29tIExpY2Vuc2UgLSBodHRwczovL2ZvbnRhd2Vzb21lLmNvbS9saWNlbnNlL2ZyZWUgQ29weXJpZ2h0IDIwMjQgRm9udGljb25zLCBJbmMuLS0+PHBhdGggZD0iTTI4OCAzMmMtODAuOCAwLTE0NS41IDM2LjgtMTkyLjYgODAuNkM0OC42IDE1NiAxNy4zIDIwOCAyLjUgMjQzLjdjLTMuMyA3LjktMy4zIDE2LjcgMCAyNC42QzE3LjMgMzA0IDQ4LjYgMzU2IDk1LjQgMzk5LjRDMTQyLjUgNDQzLjIgMjA3LjIgNDgwIDI4OCA0ODBzMTQ1LjUtMzYuOCAxOTIuNi04MC42YzQ2LjgtNDMuNSA3OC4xLTk1LjQgOTMtMTMxLjFjMy4zLTcuOSAzLjMtMTYuNyAwLTI0LjZjLTE0LjktMzUuNy00Ni4yLTg3LjctOTMtMTMxLjFDNDMzLjUgNjguOCAzNjguOCAzMiAyODggMzJ6TTE0NCAyNTZhMTQ0IDE0NCAwIDEgMSAyODggMCAxNDQgMTQ0IDAgMSAxIC0yODggMHptMTQ0LTY0YzAgMzUuMy0yOC43IDY0LTY0IDY0Yy03LjEgMC0xMy45LTEuMi0yMC4zLTMuM2MtNS41LTEuOC0xMS45IDEuNi0xMS43IDcuNGMuMyA2LjkgMS4zIDEzLjggMy4yIDIwLjdjMTMuNyA1MS4yIDY2LjQgODEuNiAxMTcuNiA2Ny45czgxLjYtNjYuNCA2Ny45LTExNy42Yy0xMS4xLTQxLjUtNDcuOC02OS40LTg4LjYtNzEuMWMtNS44LS4yLTkuMiA2LjEtNy40IDExLjdjMi4xIDYuNCAzLjMgMTMuMiAzLjMgMjAuM3oiLz48L3N2Zz4=";
            toggleIcon.addEventListener("click", function () {
                const passwordInput = document.getElementById("staticrypt-password");
                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            // handle password form submission — inline error instead of alert()
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    const err = document.getElementById("gate-error");
                    err.textContent = templateError;
                    err.classList.remove("is-visible");
                    void err.offsetWidth;
                    err.classList.add("is-visible");
                    document.getElementById("staticrypt-password").select();
                }
            });
        </script>
    </body>
</html>
